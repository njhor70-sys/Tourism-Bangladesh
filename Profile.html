<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>My Profile - Tourism Bangladesh</title>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="Assets/TourismBangladesh.png" alt="Tourism Bangladesh" class="h-10 w-auto object-contain">
      <span class="text-xl font-bold text-green-600">Tourism Bangladesh</span>
    </div>
    <ul class="hidden md:flex space-x-8 font-medium text-gray-700 items-center">
      <li><a href="Home.html" class="hover:text-green-600 transition">Home</a></li>
      <li><a href="Tourism.html" class="hover:text-green-600 transition">Tourism</a></li>
      <li><a href="MyBookings.html" class="hover:text-green-600 transition">My Bookings</a></li>
      <li><a href="Profile.html" class="text-green-600 font-bold">Profile</a></li>
      <li><span id="user-greeting" class="text-green-600 font-semibold text-sm"></span></li>
      <li><button onclick="logout()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">Log Out</button></li>
    </ul>
    <button id="menu-btn" class="md:hidden text-gray-700 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden px-6 pb-4">
    <ul class="space-y-3 font-medium text-gray-700">
      <li><a href="Home.html" class="block hover:text-green-600">Home</a></li>
      <li><a href="Tourism.html" class="block hover:text-green-600">Tourism</a></li>
      <li><a href="MyBookings.html" class="block hover:text-green-600">My Bookings</a></li>
      <li><button onclick="logout()" class="block text-center bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 w-full">Log Out</button></li>
    </ul>
  </div>
</nav>

<!-- Hero -->
<div class="bg-gradient-to-r from-green-800 to-green-600 text-white text-center py-12 px-4">
  <h1 class="text-4xl font-bold mb-2">My Profile</h1>
  <p class="text-green-100">Manage your account information</p>
</div>

<!-- Profile Card -->
<section class="max-w-xl mx-auto px-4 py-12">

  <!-- Avatar + Name -->
  <div class="bg-white rounded-2xl shadow-md p-8 mb-6 text-center">
    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-5xl mx-auto mb-4">👤</div>
    <h2 class="text-2xl font-bold text-gray-800" id="profile-name">Loading...</h2>
    <p class="text-gray-500" id="profile-mobile"></p>
  </div>

  <!-- Edit Form -->
  <div class="bg-white rounded-2xl shadow-md p-8">
    <h3 class="text-xl font-bold text-gray-800 mb-6">Update Profile</h3>

    <div class="mb-5">
      <label class="block text-gray-700 font-semibold mb-2">Full Name</label>
      <input type="text" id="edit-name" placeholder="Enter your name"
        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500 transition">
    </div>

    <div class="mb-5">
      <label class="block text-gray-700 font-semibold mb-2">Mobile Number</label>
      <input type="text" id="edit-mobile" placeholder="01XXXXXXXXX"
        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500 transition">
    </div>

    <div class="border-t pt-5 mt-5">
      <h3 class="text-xl font-bold text-gray-800 mb-4">Change PIN</h3>
      <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2">Current PIN</label>
        <input type="password" id="current-pin" placeholder="Enter current PIN"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500 transition">
      </div>
      <div class="mb-5">
        <label class="block text-gray-700 font-semibold mb-2">New PIN</label>
        <input type="password" id="new-pin" placeholder="Enter new PIN"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500 transition">
      </div>
    </div>

    <button onclick="updateProfile()"
      class="w-full bg-green-600 text-white py-3 rounded-xl hover:bg-green-700 transition font-semibold text-base">
      💾 Save Changes
    </button>
    <p id="profile-msg" class="text-center mt-4 font-semibold text-sm"></p>
  </div>
</section>

<footer class="bg-gray-900 text-gray-300">
  <div class="max-w-7xl mx-auto px-6 py-8 text-center text-sm text-gray-500">
    © 2026 Tourism Bangladesh. All rights reserved.
  </div>
</footer>

<script>
  
  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if (!token) window.location.href = "index.html";

  // Fill profile info
  document.getElementById("profile-name").textContent = user.name || "No name set";
  document.getElementById("profile-mobile").textContent = "📱 " + (user.mobile || "");
  document.getElementById("edit-name").value = user.name || "";
  document.getElementById("edit-mobile").value = user.mobile || "";

  const greetEl = document.getElementById("user-greeting");
  if (greetEl && user.name) greetEl.textContent = "Hi, " + user.name + "!";
  document.getElementById("menu-btn").addEventListener("click", () => {
    document.getElementById("mobile-menu").classList.toggle("hidden");
  });

  async function updateProfile() {
    const name = document.getElementById("edit-name").value.trim();
    const mobile = document.getElementById("edit-mobile").value.trim();
    const currentPin = document.getElementById("current-pin").value.trim();
    const newPin = document.getElementById("new-pin").value.trim();
    const msg = document.getElementById("profile-msg");

    if (!name || !mobile) {
      msg.textContent = "Name and mobile cannot be empty.";
      msg.className = "text-center mt-4 font-semibold text-sm text-red-500";
      return;
    }

    try {
      const res = await fetch(`${API}/auth/update`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: token },
        body: JSON.stringify({ name, mobile, currentPin, newPin })
      });
      const data = await res.json();

      if (res.ok) {
        // Update localStorage
        const updatedUser = { ...user, name, mobile };
        localStorage.setItem("user", JSON.stringify(updatedUser));
        document.getElementById("profile-name").textContent = name;
        document.getElementById("profile-mobile").textContent = "📱 " + mobile;
        msg.textContent = "✅ Profile updated successfully!";
        msg.className = "text-center mt-4 font-semibold text-sm text-green-600";
        document.getElementById("current-pin").value = "";
        document.getElementById("new-pin").value = "";
      } else {
        msg.textContent = data.message;
        msg.className = "text-center mt-4 font-semibold text-sm text-red-500";
      }
    } catch (err) {
      msg.textContent = "Server error. Try again.";
      msg.className = "text-center mt-4 font-semibold text-sm text-red-500";
    }
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "index.html";
  }
</script>
<script src="toast.js"></script>
<script src="config.js"></script>
<script src="auth-guard.js"></script>
</body>
</html>

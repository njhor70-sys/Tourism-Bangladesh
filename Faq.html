<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>FAQ - Tourism Bangladesh</title>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="Assets/TourismBangladesh.png" alt="Tourism Bangladesh" class="h-10 w-auto object-contain">
      <span class="text-xl font-bold text-green-600">Tourism Bangladesh</span>
    </div>
    <ul class="hidden md:flex space-x-8 font-medium text-gray-700 items-center">
      <li><a href="Home.html" class="hover:text-green-600 transition">Home</a></li>
      <li><a href="AboutUs.html" class="hover:text-green-600 transition">About Us</a></li>
      <li><a href="Tourism.html" class="hover:text-green-600 transition">Tourism</a></li>
      <li><a href="Faq.html" class="hover:text-green-600 transition">FAQ</a></li>
      <li><a href="Blog.html" class="hover:text-green-600 transition">Blog</a></li>
      <li><span id="user-greeting" class="text-green-600 font-semibold text-sm"></span></li>
      <li>
        <button onclick="logout()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">Log Out</button>
      </li>
    </ul>
    <button id="menu-btn" class="md:hidden text-gray-700 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden px-6 pb-4">
    <ul class="space-y-4 font-medium text-gray-700">
      <li><a href="Home.html" class="block hover:text-green-600">Home</a></li>
      <li><a href="AboutUs.html" class="block hover:text-green-600">About Us</a></li>
      <li><a href="Tourism.html" class="block hover:text-green-600">Tourism</a></li>
      <li><a href="Faq.html" class="block hover:text-green-600">FAQ</a></li>
      <li><a href="Blog.html" class="block hover:text-green-600">Blog</a></li>
      <li><button onclick="logout()" class="block text-center bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 w-full">Log Out</button></li>
    </ul>
  </div>
</nav>

<!-- Hero Banner -->
<div class="bg-gradient-to-r from-green-800 to-green-600 text-white text-center py-16 px-4">
  <h1 class="text-4xl font-bold mb-2">Frequently Asked Questions</h1>
  <p class="text-green-100">Everything you need to know about traveling with us</p>
</div>

<!-- FAQ Section -->
<section class="max-w-3xl mx-auto px-4 py-16">
  <div id="faq-list" class="space-y-4"></div>
</section>

<!-- Footer -->
<footer class="bg-gray-900 text-gray-300">
  <div class="max-w-7xl mx-auto px-6 py-8 text-center text-sm text-gray-500">
    © 2026 Tourism Bangladesh. All rights reserved.
  </div>
</footer>

<script>
  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if (!token) window.location.href = "index.html";
  const greetEl = document.getElementById("user-greeting");
  if (greetEl && user.name) greetEl.textContent = "Hi, " + user.name + "!";
  document.getElementById("menu-btn").addEventListener("click", () => {
    document.getElementById("mobile-menu").classList.toggle("hidden");
  });
  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "index.html";
  }

  const faqs = [
    { q: "How do I book a tour?", a: "Go to our Tourism page, browse available tours, and click 'Book Now'. Fill in your details and confirm your booking. You'll receive a confirmation immediately." },
    { q: "Can I cancel my booking?", a: "Yes, you can cancel your booking up to 48 hours before the tour departure date. Please contact us for cancellations. Refunds are processed within 3-5 business days." },
    { q: "What is included in the tour price?", a: "Tour prices include accommodation, transportation, guide fees, and entry tickets. Meals are included only if specifically stated in the tour description." },
    { q: "Is travel insurance included?", a: "Basic travel insurance is included in all our tour packages. We recommend purchasing additional coverage for adventure activities." },
    { q: "What should I bring on the tour?", a: "We recommend comfortable walking shoes, weather-appropriate clothing, sunscreen, insect repellent, a water bottle, and a small backpack." },
    { q: "Are the tours suitable for children?", a: "Most tours are family-friendly for children above 5 years. Some adventure tours have age restrictions. Please check individual tour descriptions." },
    { q: "How many people are in each tour group?", a: "Our tour groups typically have 10-25 participants. Private tours can also be arranged for families or corporate groups." },
    { q: "What payment methods do you accept?", a: "We accept bKash, Nagad, Rocket, bank transfers, and cash payments." },
    { q: "Do you offer custom tour packages?", a: "Absolutely! We can create personalized tour packages based on your preferences, budget, and schedule. Contact us with your requirements." },
    { q: "What languages do your guides speak?", a: "All our guides speak Bengali and English fluently. Some guides also speak Hindi and Arabic for international visitors." },
  ];

  const faqList = document.getElementById("faq-list");
  faqList.innerHTML = faqs.map((item, i) => `
    <div class="border-2 border-gray-200 rounded-xl overflow-hidden" id="faq-${i}">
      <button onclick="toggleFaq(${i})"
        class="w-full px-6 py-5 bg-white text-left flex justify-between items-center font-semibold text-gray-800 hover:bg-gray-50 transition">
        <span>${item.q}</span>
        <span class="text-2xl text-gray-400 transition-transform" id="icon-${i}">+</span>
      </button>
      <div class="hidden px-6 pb-5 text-gray-600 leading-relaxed bg-white" id="ans-${i}">
        ${item.a}
      </div>
    </div>
  `).join("");

  function toggleFaq(i) {
    const ans = document.getElementById(`ans-${i}`);
    const icon = document.getElementById(`icon-${i}`);
    const isOpen = !ans.classList.contains("hidden");
    // Close all
    faqs.forEach((_, j) => {
      document.getElementById(`ans-${j}`).classList.add("hidden");
      document.getElementById(`icon-${j}`).textContent = "+";
      document.getElementById(`faq-${j}`).classList.remove("border-green-500");
    });
    if (!isOpen) {
      ans.classList.remove("hidden");
      icon.textContent = "−";
      document.getElementById(`faq-${i}`).classList.add("border-green-500");
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Admin Panel - Tourism Bangladesh</title>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-gray-900 shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xl font-bold text-green-400">⚙️ Admin Panel</span>
    </div>
    <div class="flex items-center gap-6">
      <a href="Home.html" class="text-gray-300 hover:text-green-400 transition text-sm">← Back to Site</a>
      <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm">Log Out</button>
    </div>
  </div>
</nav>

<!-- Stats Bar -->
<div class="bg-gray-800 text-white">
  <div class="max-w-7xl mx-auto px-6 py-6 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
    <div>
      <div class="text-3xl font-bold text-green-400" id="stat-tours">-</div>
      <div class="text-gray-400 text-sm mt-1">Total Tours</div>
    </div>
    <div>
      <div class="text-3xl font-bold text-blue-400" id="stat-bookings">-</div>
      <div class="text-gray-400 text-sm mt-1">Total Bookings</div>
    </div>
    <div>
      <div class="text-3xl font-bold text-yellow-400" id="stat-revenue">-</div>
      <div class="text-gray-400 text-sm mt-1">Total Revenue</div>
    </div>
    <div>
      <div class="text-3xl font-bold text-purple-400" id="stat-users">-</div>
      <div class="text-gray-400 text-sm mt-1">Registered Users</div>
    </div>
  </div>
</div>

<div class="max-w-7xl mx-auto px-4 py-10">

  <!-- Add New Tour -->
  <div class="bg-white rounded-2xl shadow-md p-8 mb-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">➕ Add New Tour</h2>
    <div class="grid md:grid-cols-2 gap-5">
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Tour Name</label>
        <input type="text" id="t-name" placeholder="e.g. Bandarban Hill Trek"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Location</label>
        <input type="text" id="t-location" placeholder="e.g. Bandarban"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Price (৳ per person)</label>
        <input type="number" id="t-price" placeholder="e.g. 4500"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Duration</label>
        <input type="text" id="t-duration" placeholder="e.g. 3 Days 2 Nights"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Image Path</label>
        <input type="text" id="t-image" placeholder="e.g. Images/bandarban.png"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Available Seats</label>
        <input type="number" id="t-seats" placeholder="e.g. 20"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
      <div class="md:col-span-2">
        <label class="block text-gray-700 font-semibold mb-2">Description</label>
        <textarea id="t-description" rows="3" placeholder="Tour description..."
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500"></textarea>
      </div>
      <div class="md:col-span-2">
        <label class="block text-gray-700 font-semibold mb-2">Highlights (comma separated)</label>
        <input type="text" id="t-highlights" placeholder="e.g. Nilgiri Peak, Boga Lake, Tribal Village"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500">
      </div>
    </div>
    <button onclick="addTour()"
      class="mt-6 bg-green-600 text-white px-8 py-3 rounded-xl hover:bg-green-700 transition font-semibold">
      ➕ Add Tour
    </button>
    <p id="add-msg" class="mt-3 font-semibold text-sm"></p>
  </div>

  <!-- All Tours -->
  <div class="bg-white rounded-2xl shadow-md p-8 mb-10">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">🗺️ All Tours</h2>
      <button onclick="loadTours()" class="text-sm text-green-600 hover:underline">🔄 Refresh</button>
    </div>
    <div id="tours-list">
      <div class="text-center py-8 text-gray-400">Loading tours...</div>
    </div>
  </div>

  <!-- All Bookings -->
  <div class="bg-white rounded-2xl shadow-md p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">📋 All Bookings</h2>
    <div id="bookings-list">
      <div class="text-center py-8 text-gray-400">Loading bookings...</div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 relative max-h-[90vh] overflow-y-auto">
    <button onclick="closeEdit()" class="absolute top-4 right-5 text-gray-400 hover:text-gray-600 text-2xl font-bold">✕</button>
    <h2 class="text-xl font-bold mb-5">✏️ Edit Tour</h2>
    <input type="hidden" id="edit-id">
    <div class="space-y-4">
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Tour Name</label>
        <input type="text" id="edit-name" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Location</label>
        <input type="text" id="edit-location" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Price (৳)</label>
        <input type="number" id="edit-price" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Duration</label>
        <input type="text" id="edit-duration" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Seats</label>
        <input type="number" id="edit-seats" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
        <textarea id="edit-description" rows="3" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"></textarea></div>
    </div>
    <button onclick="saveEdit()" class="mt-5 w-full bg-green-600 text-white py-3 rounded-xl hover:bg-green-700 font-semibold">💾 Save Changes</button>
    <p id="edit-msg" class="text-center mt-3 text-sm font-semibold"></p>
  </div>
</div>

<footer class="bg-gray-900 text-gray-300 mt-10">
  <div class="max-w-7xl mx-auto px-6 py-8 text-center text-sm text-gray-500">
    © 2026 Tourism Bangladesh Admin Panel
  </div>
</footer>

<script>
  const API = "http://localhost:5000/api";
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "index.html";

  async function loadTours() {
    const container = document.getElementById("tours-list");
    try {
      const res = await fetch(`${API}/tours`);
      const tours = await res.json();
      document.getElementById("stat-tours").textContent = tours.length;

      if (!tours.length) {
        container.innerHTML = `<p class="text-gray-400 text-center py-8">No tours found. Add one above!</p>`;
        return;
      }

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-600 text-left">
                <th class="px-4 py-3 rounded-l-xl">Tour</th>
                <th class="px-4 py-3">Location</th>
                <th class="px-4 py-3">Price</th>
                <th class="px-4 py-3">Seats</th>
                <th class="px-4 py-3 rounded-r-xl">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${tours.map(t => `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-4 py-4 font-semibold">${t.name}</td>
                  <td class="px-4 py-4 text-gray-500">📍 ${t.location}</td>
                  <td class="px-4 py-4 font-bold text-green-600">৳${t.price.toLocaleString()}</td>
                  <td class="px-4 py-4 text-orange-500">🪑 ${t.seats}</td>
                  <td class="px-4 py-4 flex gap-2">
                    <button onclick='openEdit(${JSON.stringify(t).replace(/'/g,"&#39;")})' 
                      class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-blue-200">✏️ Edit</button>
                    <button onclick="deleteTour('${t._id}')" 
                      class="bg-red-100 text-red-700 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-red-200">🗑️ Delete</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      container.innerHTML = `<p class="text-red-500 text-center">Cannot load tours. Backend chalu ache?</p>`;
    }
  }

  async function loadBookings() {
    const container = document.getElementById("bookings-list");
    try {
      const res = await fetch(`${API}/bookings/all`, {
        headers: { Authorization: token }
      });
      const bookings = await res.json();
      document.getElementById("stat-bookings").textContent = bookings.length;
      const revenue = bookings.reduce((sum, b) => sum + b.totalPrice, 0);
      document.getElementById("stat-revenue").textContent = "৳" + revenue.toLocaleString();

      if (!bookings.length) {
        container.innerHTML = `<p class="text-gray-400 text-center py-8">No bookings yet.</p>`;
        return;
      }

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-600 text-left">
                <th class="px-4 py-3">Tour</th>
                <th class="px-4 py-3">Customer</th>
                <th class="px-4 py-3">Phone</th>
                <th class="px-4 py-3">Persons</th>
                <th class="px-4 py-3">Total</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3">Date</th>
              </tr>
            </thead>
            <tbody>
              ${bookings.map(b => `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-4 py-3 font-semibold">${b.tourName}</td>
                  <td class="px-4 py-3">${b.name}</td>
                  <td class="px-4 py-3 text-gray-500">${b.phone}</td>
                  <td class="px-4 py-3 text-center">${b.persons}</td>
                  <td class="px-4 py-3 font-bold text-green-600">৳${b.totalPrice.toLocaleString()}</td>
                  <td class="px-4 py-3">
                    <span class="px-2 py-1 rounded-full text-xs font-bold ${b.status === 'confirmed' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                      ${b.status}
                    </span>
                  </td>
                  <td class="px-4 py-3 text-gray-400 text-xs">${new Date(b.createdAt).toLocaleDateString()}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      container.innerHTML = `<p class="text-red-500 text-center">Cannot load bookings.</p>`;
    }
  }

  async function addTour() {
    const name = document.getElementById("t-name").value.trim();
    const location = document.getElementById("t-location").value.trim();
    const price = document.getElementById("t-price").value;
    const duration = document.getElementById("t-duration").value.trim();
    const image = document.getElementById("t-image").value.trim();
    const seats = document.getElementById("t-seats").value;
    const description = document.getElementById("t-description").value.trim();
    const highlights = document.getElementById("t-highlights").value.split(",").map(h => h.trim()).filter(Boolean);
    const msg = document.getElementById("add-msg");

    if (!name || !location || !price || !duration) {
      msg.textContent = "Please fill name, location, price and duration.";
      msg.className = "mt-3 font-semibold text-sm text-red-500";
      return;
    }

    try {
      const res = await fetch(`${API}/tours`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: token },
        body: JSON.stringify({ name, location, price: Number(price), duration, image, seats: Number(seats) || 20, description, highlights })
      });
      const data = await res.json();
      if (res.ok) {
        msg.textContent = "✅ Tour added successfully!";
        msg.className = "mt-3 font-semibold text-sm text-green-600";
        ["t-name","t-location","t-price","t-duration","t-image","t-seats","t-description","t-highlights"].forEach(id => document.getElementById(id).value = "");
        loadTours();
      } else {
        msg.textContent = data.message;
        msg.className = "mt-3 font-semibold text-sm text-red-500";
      }
    } catch (err) {
      msg.textContent = "Server error.";
      msg.className = "mt-3 font-semibold text-sm text-red-500";
    }
  }

  async function deleteTour(id) {
    if (!confirm("Are you sure you want to delete this tour?")) return;
    try {
      await fetch(`${API}/tours/${id}`, { method: "DELETE", headers: { Authorization: token } });
      loadTours();
    } catch (err) { alert("Delete failed."); }
  }

  function openEdit(tour) {
    document.getElementById("edit-id").value = tour._id;
    document.getElementById("edit-name").value = tour.name;
    document.getElementById("edit-location").value = tour.location;
    document.getElementById("edit-price").value = tour.price;
    document.getElementById("edit-duration").value = tour.duration;
    document.getElementById("edit-seats").value = tour.seats;
    document.getElementById("edit-description").value = tour.description;
    document.getElementById("editModal").classList.remove("hidden");
  }

  function closeEdit() {
    document.getElementById("editModal").classList.add("hidden");
  }

  async function saveEdit() {
    const id = document.getElementById("edit-id").value;
    const msg = document.getElementById("edit-msg");
    const body = {
      name: document.getElementById("edit-name").value,
      location: document.getElementById("edit-location").value,
      price: Number(document.getElementById("edit-price").value),
      duration: document.getElementById("edit-duration").value,
      seats: Number(document.getElementById("edit-seats").value),
      description: document.getElementById("edit-description").value
    };
    try {
      const res = await fetch(`${API}/tours/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: token },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        msg.textContent = "✅ Updated!";
        msg.className = "text-center mt-3 text-sm font-semibold text-green-600";
        setTimeout(() => { closeEdit(); loadTours(); }, 800);
      }
    } catch (err) {
      msg.textContent = "Update failed.";
      msg.className = "text-center mt-3 text-sm font-semibold text-red-500";
    }
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "index.html";
  }

  loadTours();
  loadBookings();
</script>
<script src="toast.js"></script>
<script src="config.js"></script>
<script src="auth-guard.js"></script>
</body>
</html>
